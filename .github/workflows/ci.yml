name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate lesson templates and example pack
        run: |
          python3 skills/learn/scripts/validate_lesson.py \
            skills/learn/assets/lesson-plan-template.json \
            --guide skills/learn/assets/teaching-guide-template.md
          python3 skills/learn/scripts/validate_lesson.py \
            examples/project-consensus/lesson-plan.json \
            --guide examples/project-consensus/teaching-guide.md \
            --manifest examples/project-consensus/sources.json
          python3 skills/learn/scripts/validate_prerequisites.py \
            skills/learn/assets/prerequisite-plan-template.json \
            --guide skills/learn/assets/prerequisite-guide-template.md
      - name: Store pipeline smoke test (init → export → register → append → build → score)
        run: |
          S=skills/learn/scripts; A=skills/learn/assets; T=$(mktemp -d)
          python3 $S/store_init.py init --store $T/store --domain-root 学习设计
          python3 $S/store_init.py register --store $T/store --lesson-plan $A/lesson-plan-template.json
          python3 $S/mrg_export.py $A/lesson-plan-template.json --store $T/store
          python3 $S/index_match.py register --store $T/store --lesson-id sample-guided-lesson
          echo answer > $T/r.txt
          python3 $S/lrg_record.py append --store $T/store --lesson-id sample-guided-lesson --section-id s01 \
            --response-file $T/r.txt --verdict partial --confidence 4 --depth mechanism \
            --extraction $A/extraction-template.json --elapsed-seconds 120
          python3 $S/learner_state_build.py build --store $T/store
          python3 $S/review_pool.py --store $T/store --lesson-id sample-guided-lesson > /dev/null
          python3 evals/score_pack.py examples/project-consensus --sources-root .. --store $T/store
      - name: Manifests are valid JSON
        working-directory: .
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugin/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugin/.codex-plugin/plugin.json > /dev/null
